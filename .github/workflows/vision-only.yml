name: Exact upstream Intel Torchvision wheel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  torchvision:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned original Torchvision using the existing audited Torch wheel
        run: /usr/bin/python3 -I -B scripts/build-vision.py
      - name: Preserve wheel, original notices, native probe and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intel-wheel-torchvision-${{ github.run_id }}
          path: result/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
